name: Site

on:
  pull_request:
    paths:
      - ".github/workflows/site.yml"
      - ".claude-design/point-and-shoot/assets/icon.svg"
      - "docs/**"
      - "site/**"
      - "src/shared/design/**"
      - "tests/visual/baselines/notes-dark.png"
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - ".claude-design/point-and-shoot/assets/icon.svg"
      - "docs/**"
      - "site/**"
      - "src/shared/design/**"
      - "tests/visual/baselines/notes-dark.png"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: npm ci
      - name: Check site
        run: npm run check
      - name: Lint site
        run: npm run lint
      - name: Test site tooling
        run: npm run test
      - name: Build site
        run: npm run build
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  link-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Check links and published scope
        run: npm run links

  accessibility:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: npm ci
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: site-playwright-${{ runner.os }}-1.62.0
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm exec -- playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Run axe
        run: npm run a11y

  lighthouse:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: npm ci
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: site-playwright-${{ runner.os }}-1.62.0
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm exec -- playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Run Lighthouse
        run: npm run lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: site/.lighthouse/
          if-no-files-found: warn

  deploy:
    if: github.event_name == 'push'
    needs: [build, link-check, accessibility, lighthouse]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
