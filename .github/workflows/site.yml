name: Site

on:
  pull_request:
    paths:
      - ".github/workflows/site.yml"
      - ".claude-design/point-and-shoot/assets/icon.svg"
      - "deno.json"
      - "deno.lock"
      - "docs/**"
      - "mise.toml"
      - "site/**"
      - "store-listing.json"
      - "src/shared/design/**"
      - "tests/visual/baselines/notes-dark.png"
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - ".claude-design/point-and-shoot/assets/icon.svg"
      - "deno.json"
      - "deno.lock"
      - "docs/**"
      - "mise.toml"
      - "site/**"
      - "store-listing.json"
      - "src/shared/design/**"
      - "tests/visual/baselines/notes-dark.png"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    permissions:
      pages: read
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Read GitHub Pages metadata
        id: pages
        uses: actions/configure-pages@v5

  build:
    needs: pages
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    # site:test launches Chromium (install-flow.test.mjs). The Playwright container
    # has it baked in — no install step needed.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      SITE_URL: ${{ needs.pages.outputs.site_url }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Check site
        run: deno task site:check
      - name: Lint site
        run: deno task site:lint
      - name: Test site tooling
        run: deno task site:test
      - name: Build site
        run: deno task site:build
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  link-check:
    needs: pages
    env:
      SITE_URL: ${{ needs.pages.outputs.site_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Build site
        run: deno task site:build
      - name: Check links and published scope
        run: deno task site:links

  # Accessibility (axe) and Lighthouse both need Chromium and a built site. Running them in one
  # job avoids a redundant site build and a second Chromium provisioning step. Lighthouse uses
  # chrome-launcher which needs the host-installed Chromium binary, so this job runs on the bare
  # runner with a cached Playwright install rather than the container image.
  quality:
    needs: pages
    runs-on: ubuntu-24.04
    env:
      SITE_URL: ${{ needs.pages.outputs.site_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-1.62.0

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: deno task playwright:install --with-deps chromium

      - name: Build site
        run: deno task site:build
      - name: Run axe
        run: deno task site:a11y
      - name: Run Lighthouse
        run: deno task site:lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: site/.lighthouse/
          if-no-files-found: warn

  deploy:
    if: github.event_name == 'push'
    needs: [build, link-check, quality]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
