name: Site

on:
  pull_request:
    paths:
      - ".github/workflows/site.yml"
      - "site/**"
      - "src/shared/design/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - "site/**"
      - "src/shared/design/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: npm ci
      - name: Check site
        run: npm run check
      - name: Lint site
        run: npm run lint
      - name: Build site
        run: npm run build
