name: Release

# Release Please uses the repository token, so its pull-request and release events do not start
# other workflows. This workflow therefore builds both the testable PR packages and final release
# assets in the same run that creates them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release_please:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr_created: ${{ steps.release_pr.outputs.prs_created }}
      pr: ${{ steps.release_pr.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Compute the next UTC calendar version
        id: version
        shell: bash
        run: |
          current="$(deno task release:current)"
          next="$(deno task release:next "${current}")"
          echo "next=${next}" >> "${GITHUB_OUTPUT}"

      # The action's manifest path does not forward its release-as input. Keep the action for
      # release outputs and use the pinned CLI for the calendar-versioned PR.
      - name: Create a GitHub release from a merged release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Create or update the release pull request
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail

          release_pr_json() {
            local branch_prefix="release-please--branches--${GITHUB_REF_NAME}"
            local pulls_url="repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${GITHUB_REF_NAME}&per_page=100"
            gh api "${pulls_url}" | jq -c --arg prefix "${branch_prefix}" '
              [.[] | select(.head.ref | startswith($prefix))][0]
              | if . == null then null else {
                  number: .number,
                  headBranchName: .head.ref,
                  sha: .head.sha
                } end
            '
          }

          before_pr="$(release_pr_json)"
          before_sha="$(jq -r '.sha // empty' <<< "${before_pr}")"
          token_file="$(mktemp "${RUNNER_TEMP}/release-please-token.XXXXXX")"
          trap 'rm -f -- "${token_file}"' EXIT INT TERM
          printf '%s' "${GH_TOKEN}" > "${token_file}"

          deno task release:pr \
            --token="${token_file}" \
            --repo-url="${GITHUB_REPOSITORY}" \
            --target-branch="${GITHUB_REF_NAME}" \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json \
            --release-as="${NEXT_VERSION}"

          pr_json="$(release_pr_json)"
          after_sha="$(jq -r '.sha // empty' <<< "${pr_json}")"
          if [[ -z "${after_sha}" || "${after_sha}" == "${before_sha}" ]]; then
            echo "prs_created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "prs_created=true" >> "${GITHUB_OUTPUT}"
          echo "pr=${pr_json}" >> "${GITHUB_OUTPUT}"

      # Release-please bumps the version in build/manifest.ts, which changes the
      # source digest checked by `store:assets:check`. Refresh the manifest so CI
      # sees a current digest without regenerating screenshots. The commit is
      # created via the GitHub API so it is signed by GitHub's web-flow key and
      # satisfies the verified-commits branch protection rule.
      - name: Refresh store asset manifest on release branch
        if: steps.release_pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release_pr.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          head_branch="$(jq -er '.headBranchName' <<< "${PR_JSON}")"
          git fetch origin "${head_branch}"
          git checkout "${head_branch}"
          deno task store:assets:refresh-manifest
          if git diff --quiet docs/assets/store/manifest.json; then
            echo "Manifest already current, nothing to push."
          else
            content="$(base64 -w0 docs/assets/store/manifest.json)"
            blob_sha="$(git rev-parse HEAD:docs/assets/store/manifest.json)"
            gh api "repos/${GITHUB_REPOSITORY}/contents/docs/assets/store/manifest.json" \
              --method PUT \
              --field message="chore: refresh store asset manifest for release" \
              --field content="${content}" \
              --field sha="${blob_sha}" \
              --field branch="${head_branch}"
          fi

      # GITHUB_TOKEN-created PRs otherwise leave CI waiting for manual approval. A workflow
      # dispatch is GitHub's explicit recursion-safe exception and attaches checks to this head.
      - name: Dispatch CI for the release pull request
        if: steps.release_pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release_pr.outputs.pr }}
        shell: bash
        run: |
          head_branch="$(jq -er '.headBranchName' <<< "${PR_JSON}")"
          gh workflow run ci.yml --ref "${head_branch}"

  preview:
    if: needs.release_please.outputs.pr_created == 'true'
    needs: release_please
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      version: ${{ steps.package.outputs.version }}
    steps:
      # The queried pull request output carries the exact head SHA after Release Please updates it.
      # A branch checkout here could race a second update and attach unreviewed bytes to the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release_please.outputs.pr).sha }}
      - uses: jdx/mise-action@v4

      - name: Build and validate release pull request packages
        id: package
        shell: bash
        run: |
          deno task release:artifacts
          deno task release:validate
          echo "version=$(deno task release:current)" >> "${GITHUB_OUTPUT}"

      - name: Upload browser and Firefox reviewer artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: point-and-shoot-${{ steps.package.outputs.version }}-release-pr
          path: |
            dist/chrome.zip
            dist/firefox.zip
            dist/firefox-source.zip
            dist/firefox-build-instructions.md
          if-no-files-found: error
          retention-days: 14

  preview_comment:
    if: needs.preview.result == 'success'
    needs: [release_please, preview]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Link the testable packages from the release pull request
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ needs.preview.outputs.artifact_url }}
          PR_NUMBER: ${{ fromJSON(needs.release_please.outputs.pr).number }}
          PR_SHA: ${{ fromJSON(needs.release_please.outputs.pr).sha }}
          VERSION: ${{ needs.preview.outputs.version }}
        with:
          script: |
            const marker = "<!-- point-and-shoot-release-preview -->";
            const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
            const body = [
              marker,
              `Candidate artifacts for \`v${process.env.VERSION}\` were built and validated`,
              `from the exact release PR commit \`${process.env.PR_SHA}\`.`,
              "",
              `[Download the release PR artifacts](${process.env.ARTIFACT_URL}) within 14 days.`,
              "These are store-submission candidates, not consumer install links.",
              "",
              "- `chrome.zip`: extract it, open `chrome://extensions`, enable Developer mode,",
              "  choose **Load unpacked**, and select the extracted directory.",
              "- `firefox.zip`: extract it, open `about:debugging#/runtime/this-firefox`, choose",
              "  **Load Temporary Add-on**, and select the extracted `manifest.json`.",
              "- `firefox-source.zip`: the tracked, allowlisted source supplied to Mozilla",
              "  reviewers so they can reproduce `firefox.zip`.",
              "- `firefox-build-instructions.md`: pinned setup, build, and normalized comparison",
              "  commands for Mozilla reviewers.",
              "",
              "Temporary browser loads disappear when the browser profile closes. The final",
              "GitHub release will attach the same four artifact names rebuilt from the tag.",
              "",
              "---",
              `<sup>Generated using [wk-skills](https://github.com/whizzzkid/skills/tree/main@%7B${timestamp}%7D) and multiple agents/models. DM me your feedback.</sup>`,
            ].join("\n");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  release_assets:
    if: needs.release_please.outputs.release_created == 'true'
    needs: release_please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Rebuild from the commit Release Please tagged, not from the workflow's triggering SHA.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release_please.outputs.release_sha }}
      - uses: jdx/mise-action@v4

      - name: Build and validate final browser packages
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          deno task release:artifacts
          deno task release:validate "${TAG_NAME}"

      - name: Attach browser and reviewer artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" dist/chrome.zip dist/firefox.zip dist/firefox-source.zip dist/firefox-build-instructions.md --clobber

      - name: Verify all release assets exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        shell: bash
        run: |
          asset_names="$(gh release view "${TAG_NAME}" --json assets --jq '[.assets[].name] | sort | join("\n")')"
          expected_assets="$(printf '%s\n' chrome.zip firefox-build-instructions.md firefox-source.zip firefox.zip)"
          if [[ "${asset_names}" != "${expected_assets}" ]]; then
            printf 'Expected exactly these release assets:\n%s\nActual release assets:\n%s\n' \
              "${expected_assets}" "${asset_names}" >&2
            exit 1
          fi

      - name: Seed browser store publication status
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp "${RUNNER_TEMP}/release-body.XXXXXX")"
          trap 'rm -f -- "${body_file}"' EXIT INT TERM
          version="$(deno task release:current)"
          reconciled_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh release view "${TAG_NAME}" --json body --jq '.body | @base64' | base64 --decode |
            deno task release:status seed "${version}" "${reconciled_at}" > "${body_file}"
          gh release edit "${TAG_NAME}" --notes-file "${body_file}"

  store_publish:
    if: needs.release_please.outputs.release_created == 'true'
    needs: [release_please, release_assets]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/store-publish.yml
    with:
      operation: submit
      release_sha: ${{ needs.release_please.outputs.release_sha }}
      tag_name: ${{ needs.release_please.outputs.tag_name }}
