name: CI

# CI is the authoritative gate. It runs `deno task ci` — the exact command the lefthook
# pre-push hook runs — so a green local push and a green CI run cannot mean different things.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the tree.
permissions:
  contents: read

# Supersede in-flight runs for the same ref rather than burning runners on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned image, not `ubuntu-latest`: exact versions everywhere is a repository rule, and a
    # floating runner label silently changes the OS under a green build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # mise installs exactly what mise.toml pins, so CI and every local machine resolve
      # identical versions from one file. A denoland/setup-deno step would be a second
      # place to bump Deno, and the two would drift.
      - uses: jdx/mise-action@v4

      - name: Print resolved toolchain
        run: |
          deno --version
          lefthook version

      # `deno task ci` is not browser-free. Two unit suites — `src/shared/selectors.test.ts` and
      # `src/shared/style-digest.test.ts` — call `chromium.launch()`, because a selector that
      # round-trips and a bounded computed-style digest can only be verified against a real engine.
      # Locally that browser is already installed, which is why the gap survived until this job first
      # ran. Same cache key and install command as `e2e-smoke`, so the two share one download.
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-1.62.0

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: deno run -A npm:playwright@1.62.0 install --with-deps chromium

      - name: deno task ci
        run: deno task ci

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: deno task build
        run: deno task build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  tokens-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: deno task tokens:check
        run: deno task tokens:check

  e2e-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      # Keyed on the pinned Playwright version in deno.json's imports, not a floating tag —
      # bumping that pin invalidates the cache instead of silently running a stale browser.
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-1.62.0

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: deno run -A npm:playwright@1.62.0 install --with-deps chromium

      - name: deno task e2e:smoke
        run: deno task e2e:smoke

      - name: Upload Playwright trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-trace
          path: playwright-report/

  lint-firefox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: deno task build
        run: deno task build
      - name: deno task lint:firefox
        run: deno task lint:firefox

  boot-firefox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      # web-ext auto-detects an installed Firefox with no pin, which drifts silently across
      # runner-image updates. Install and pin explicitly so this job is reproducible like every
      # other toolchain piece here.
      - uses: browser-actions/setup-firefox@v1
        id: setup-firefox
        with:
          firefox-version: "153.0"

      - name: deno task build
        run: deno task build

      - name: deno task boot:firefox
        run: deno task boot:firefox
        env:
          PNS_FIREFOX_BINARY: ${{ steps.setup-firefox.outputs.firefox-path }}
