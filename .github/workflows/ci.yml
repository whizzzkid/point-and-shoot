name: CI

# CI is the authoritative gate. It runs `deno task ci` — the exact command the lefthook
# pre-push hook runs — so a green local push and a green CI run cannot mean different things.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the tree.
permissions:
  contents: read

# Supersede in-flight runs for the same ref rather than burning runners on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned image, not `ubuntu-latest`: exact versions everywhere is a repository rule, and a
    # floating runner label silently changes the OS under a green build.
    runs-on: ubuntu-24.04
    # Chromium is baked into the Playwright container — no install step, no cache dance, no
    # apt-get for system deps. Same image the `visual` job already uses.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7

      # The Playwright container is minimal — it ships Chromium and its deps but not
      # general-purpose utilities. The build test suite shells out to `zip` for release
      # archive validation, and `git ls-files` for reviewer-source tests. The workspace
      # is owned by the runner user, not the container's root, so git needs safe.directory.
      - name: Install container extras
        run: |
          apt-get update -qq && apt-get install -y -qq zip > /dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # mise installs exactly what mise.toml pins, so CI and every local machine resolve
      # identical versions from one file. A denoland/setup-deno step would be a second
      # place to bump Deno, and the two would drift.
      - uses: jdx/mise-action@v4

      - name: Print resolved toolchain
        run: |
          deno --version
          lefthook version

      - name: deno task ci
        run: deno task ci

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Build extension
        run: deno task build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  tokens-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: deno task tokens:check
        run: deno task tokens:check

  e2e-smoke:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: deno task e2e:smoke
        run: deno task e2e:smoke

      - name: Upload Playwright trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-trace
          path: playwright-report/

  e2e-full:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: deno task e2e:full
        run: deno task e2e:full

      - name: Upload full E2E traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-full-traces
          path: playwright-report/
          if-no-files-found: warn

  visual:
    runs-on: ubuntu-24.04
    # Baselines are generated in this exact image. Running the comparison on the GitHub host
    # changes system fonts and makes otherwise-identical fixture text produce large diffs.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PNS_VISUAL_UPDATE_PLATFORM: ubuntu-24.04-playwright-1.62.0
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The Visual job regenerates baselines and commits them back to the PR branch, so it
          # checks out the PR head rather than the merge ref. Only same-repo pull requests can be
          # pushed back to (a fork branch doesn't exist in this repo to check out by name); on
          # fork PRs, push/workflow_dispatch runs the default checkout (the merge or pushed ref)
          # is correct.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - uses: jdx/mise-action@v4

      - name: deno task visual
        id: compare
        run: deno task visual

      # Baseline regeneration pushes to the branch, which only makes sense for same-repo pull
      # requests. Fork PRs cannot push, and push/workflow_dispatch runs have no branch to update.
      # github.repository is always this repo's own slug, so it must be compared against the
      # PR's head repo (not hardcoded) to actually detect same-repo vs. fork.
      - name: Regenerate drifted baselines and commit them back
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          deno task visual:update
          git config --global --add safe.directory /__w/point-and-shoot/point-and-shoot
          git add tests/visual/baselines/
          if git diff --cached --quiet; then
            echo "no baseline files changed; nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(visual): refresh baselines for ${GITHUB_HEAD_REF}"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: playwright-report/visual/
          if-no-files-found: warn

  a11y:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: deno task a11y
        run: deno task a11y

      - name: Upload axe reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-axe-reports
          path: playwright-report/a11y/
          if-no-files-found: warn

  lint-firefox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: deno task build
        run: deno task build
      - name: deno task lint:firefox
        run: deno task lint:firefox

  boot-firefox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      # web-ext auto-detects an installed Firefox with no pin, which drifts silently across
      # runner-image updates. Install and pin explicitly so this job is reproducible like every
      # other toolchain piece here.
      - uses: browser-actions/setup-firefox@v1
        id: setup-firefox
        with:
          firefox-version: "153.0"

      - name: deno task build
        run: deno task build

      - name: deno task boot:firefox
        run: deno task boot:firefox
        env:
          PNS_FIREFOX_BINARY: ${{ steps.setup-firefox.outputs.firefox-path }}

  smoke-firefox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/firefox
          key: firefox-browser-${{ runner.os }}-${{ runner.arch }}-153.0

      - uses: browser-actions/setup-firefox@v1
        id: setup-firefox
        with:
          firefox-version: "153.0"

      - name: deno task smoke:firefox
        run: deno task smoke:firefox
        env:
          PNS_FIREFOX_BINARY: ${{ steps.setup-firefox.outputs.firefox-path }}
