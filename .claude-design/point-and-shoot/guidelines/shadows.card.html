<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows & focus" subtitle="Two-tier elevation + accent focus ring" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;align-items:center;gap:24px;height:160px;padding:16px;background:var(--bg-canvas)">
<div style="width:120px;height:70px;background:var(--bg-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font:11px var(--font-mono)">sm</div>
<div style="width:120px;height:70px;background:var(--bg-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font:11px var(--font-mono)">md</div>
<div style="width:120px;height:70px;background:var(--bg-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font:11px var(--font-mono)">lg</div>
<div style="width:120px;height:70px;background:var(--bg-surface);border:1px solid var(--accent);border-radius:var(--radius-md);box-shadow:var(--shadow-focus);display:flex;align-items:center;justify-content:center;color:var(--accent);font:11px var(--font-mono)">focus</div>
</div>
