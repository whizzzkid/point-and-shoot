<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base unit, --space-1 through --space-24" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;align-items:flex-end;gap:6px;height:150px;padding:16px;background:var(--bg-canvas)">
<div style="width:var(--space-1);height:var(--space-1);background:var(--accent)"></div>
<div style="width:var(--space-2);height:var(--space-2);background:var(--accent)"></div>
<div style="width:var(--space-3);height:var(--space-3);background:var(--accent)"></div>
<div style="width:var(--space-4);height:var(--space-4);background:var(--accent)"></div>
<div style="width:var(--space-6);height:var(--space-6);background:var(--accent)"></div>
<div style="width:var(--space-8);height:var(--space-8);background:var(--accent)"></div>
<div style="width:var(--space-12);height:var(--space-12);background:var(--accent)"></div>
<div style="width:var(--space-16);height:var(--space-16);background:var(--accent)"></div>
<div style="width:var(--space-24);height:var(--space-24);background:var(--accent);align-self:flex-start"></div>
</div>
