<!-- @dsCard group="Colors" viewport="700x150" name="Light theme surfaces" subtitle="data-theme=&quot;light&quot; — same tokens, light scope" -->
<link rel="stylesheet" href="../styles.css">
<div data-theme="light" style="display:flex;gap:12px;height:150px;background:var(--bg-canvas);padding:16px;align-items:center">
<div style="flex:1;height:100px;background:var(--bg-canvas);border:1px solid var(--border-subtle);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font:12px var(--font-mono)">canvas</div>
<div style="flex:1;height:100px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font:12px var(--font-mono)">surface</div>
<div style="flex:1;height:100px;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-primary);font:12px var(--font-mono);box-shadow:var(--shadow-md)">elevated</div>
<div style="flex:1;height:100px;background:var(--accent);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:#fff;font:12px var(--font-mono)">accent</div>
</div>
