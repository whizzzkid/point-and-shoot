<!-- @dsCard group="Colors" viewport="700x150" name="Accent & semantic" subtitle="Single accent blue; semantic colors reserved for status" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:0;height:150px;font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)">
<div style="flex:2;background:var(--accent);display:flex;align-items:flex-end;padding:10px;color:#fff">accent #4f7cff</div>
<div style="flex:1;background:var(--accent-hover);display:flex;align-items:flex-end;padding:10px;color:#fff">hover</div>
<div style="flex:1;background:var(--accent-active);display:flex;align-items:flex-end;padding:10px;color:#fff">active</div>
<div style="flex:1;background:var(--success);display:flex;align-items:flex-end;padding:10px;color:#06120b">success</div>
<div style="flex:1;background:var(--warning);display:flex;align-items:flex-end;padding:10px;color:#1f1400">warning</div>
<div style="flex:1;background:var(--danger);display:flex;align-items:flex-end;padding:10px;color:#1f0505">danger</div>
</div>
