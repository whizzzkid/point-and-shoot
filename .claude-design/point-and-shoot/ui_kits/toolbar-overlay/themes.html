<!-- @dsCard group="Toolbar Overlay" viewport="700x360" name="Overlay chrome — dark & light" subtitle="Same toolbar in both themes, over a light and a dark page" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style>
<div id="root"></div>
<script type="text/babel">
const {Button,IconButton,Icon,Badge}=window.PointShootDesignSystem_5498d1;

function Bar(){
return (<div style={{display:'flex',alignItems:'center',gap:6,background:'var(--bg-overlay)',backdropFilter:'blur(var(--blur-panel))',border:'1px solid var(--border-strong)',borderRadius:'var(--radius-lg)',padding:8,boxShadow:'var(--shadow-lg)'}}>
<IconButton icon={<Icon name="crosshair"/>} label="Select" active/>
<IconButton icon={<Icon name="camera"/>} label="Screenshot"/>
<IconButton icon={<Icon name="message-square-plus"/>} label="Note"/>
<div style={{width:1,height:20,background:'var(--border-default)',margin:'0 4px'}}></div>
<Badge tone="accent">2 notes</Badge>
<Button size="sm">Send to agent</Button>
</div>);
}

function Strip({theme,pageBg,pageFg,label}){
return (<div style={{position:'relative',height:150,background:pageBg,borderRadius:'var(--radius-md)',overflow:'hidden',display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:18}}>
<div style={{position:'absolute',top:14,left:16,fontFamily:'Arial,sans-serif',fontSize:13,fontWeight:700,color:pageFg}}>{label}</div>
<div data-theme={theme}><Bar/></div>
</div>);
}

function Demo(){
return (<div style={{width:700,padding:20,background:'#3a3d45',display:'flex',flexDirection:'column',gap:16,boxSizing:'border-box'}}>
<Strip theme="dark" pageBg="#f4f4f2" pageFg="#222" label="Dark overlay on a light page"/>
<Strip theme="light" pageBg="#121317" pageFg="#e4e7ec" label="Light overlay on a dark page"/>
</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
