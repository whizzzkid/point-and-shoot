<!-- @dsCard group="Options" viewport="900x600" name="Options / settings" subtitle="Shortcut, capture, and agent configuration" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style>
<div id="root"></div>
<script type="text/babel">
const {Switch,Select,Input,Tabs,Icon,IconButton}=window.PointShootDesignSystem_5498d1;

function Row({label,help,children}){
return (<div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'16px 0',borderBottom:'1px solid var(--border-subtle)',gap:24}}>
<div style={{maxWidth:340}}>
<div style={{fontSize:13,color:'var(--text-primary)',fontWeight:500}}>{label}</div>
{help&&<div style={{fontSize:12,color:'var(--text-tertiary)',marginTop:3}}>{help}</div>}
</div>
<div style={{flexShrink:0}}>{children}</div>
</div>);
}

function Demo(){
const [tab,setTab]=React.useState('General');
const [capture,setCapture]=React.useState(true);
const [dom,setDom]=React.useState(true);
const [playwright,setPlaywright]=React.useState(false);
const [theme,setTheme]=React.useState('dark');
return (<div data-theme={theme} style={{width:900,height:600,background:'var(--bg-canvas)',fontFamily:'var(--font-body)',display:'flex',flexDirection:'column'}}>
<div style={{padding:'20px 32px 0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
<div style={{display:'flex',alignItems:'center',gap:9}}><img src="../../assets/icon.svg" alt="" style={{width:19,height:19,filter:'drop-shadow(var(--glow-accent))'}}/><div style={{fontSize:20,fontFamily:'var(--font-display)',fontWeight:600,color:'var(--text-primary)'}}>Settings</div></div>
<IconButton icon={<Icon name={theme==='dark'?'sun':'moon'}/>} label="Toggle theme" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}/>
</div>
<div style={{padding:'0 32px'}}>
<Tabs tabs={['General','Shortcuts','Capture','Agent']} active={tab} onChange={setTab}/>
</div>
<div style={{flex:1,overflowY:'auto',padding:'8px 32px',maxWidth:640}}>
{tab==='General'&&<React.Fragment>
<Row label="Theme" help="Match your system, or force dark/light."><div style={{width:160}}><Select options={['Dark','Light','System']}/></div></Row>
<Row label="Show toolbar on load" help="Automatically show the action bar when the extension is turned on for a tab."><Switch checked={capture} onChange={setCapture}/></Row>
</React.Fragment>}
{tab==='Shortcuts'&&<React.Fragment>
<Row label="Toggle extension" help="Show or hide the toolbar on the current page."><div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-secondary)',background:'var(--bg-elevated)',border:'1px solid var(--border-default)',borderRadius:'var(--radius-sm)',padding:'4px 8px'}}>⌘ Shift P</div></Row>
<Row label="Quick capture" help="Start a highlight selection immediately."><div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-secondary)',background:'var(--bg-elevated)',border:'1px solid var(--border-default)',borderRadius:'var(--radius-sm)',padding:'4px 8px'}}>⌘ Shift X</div></Row>
</React.Fragment>}
{tab==='Capture'&&<React.Fragment>
<Row label="Include DOM context" help="Capture surrounding elements and meta tags with every note."><Switch checked={dom} onChange={setDom}/></Row>
<Row label="Screenshot format" help="Used when saving captured regions."><div style={{width:160}}><Select options={['PNG','JPEG']}/></div></Row>
</React.Fragment>}
{tab==='Agent'&&<React.Fragment>
<Row label="Local agent" help="Point & Shoot writes plans this agent can read from disk."><Input placeholder="~/agents/local-fix-agent"/></Row>
<Row label="Playwright companion mode" help="Load as a companion extension for local Playwright runs."><Switch checked={playwright} onChange={setPlaywright}/></Row>
<Row label="Remote host" help="Coming in v2 — send plans to a configurable host with repo + target access."><div style={{width:160}}><Select options={['Not configured']}/></div></Row>
</React.Fragment>}
</div>
</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
