<!-- @dsCard group="Notes Panel" viewport="900x600" name="Notes panel" subtitle="Full review list of all notes captured on a page" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../components/capture/CaptureMinimap.global.js"></script>
<style>body{margin:0}</style>
<div id="root"></div>
<script type="text/babel">
const DS=window.PointShootDesignSystem_5498d1;
const {Button,IconButton,Icon,Badge,Tag,Checkbox}=DS;
const CaptureMinimap=DS.CaptureMinimap||window.PSCaptureMinimap;

const NOTES=[
{id:1,el:'button.hero-cta',xpath:"//*[@id='hero']/button[1]",region:{x:.08,y:.42,w:.2,h:.09},text:'CTA color has too little contrast against background — fails WCAG AA.',status:'pending'},
{id:2,el:'nav.main-nav',xpath:"//*[@id='root']/header/nav",region:{x:.06,y:.07,w:.86,h:.1},text:'Nav collapses too early on tablet width, links overlap logo.',status:'sent'},
{id:3,el:'.pricing-card:nth-child(2)',xpath:"//*[@id='pricing']/div[2]",region:{x:.38,y:.55,w:.26,h:.28},text:'"Most popular" badge overlaps the price on smaller screens.',status:'pending'},
{id:4,el:'footer a.legal-link',xpath:"//*[@id='footer']/div[3]/a[2]",region:{x:.1,y:.82,w:.16,h:.06},text:'Link text "here" is not descriptive for screen readers.',status:'fixed'},
];

function Demo(){
const [sel,setSel]=React.useState([1,3]);
const [theme,setTheme]=React.useState('dark');
function toggle(id){setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);}
return (<div data-theme={theme} style={{width:900,height:600,background:'var(--bg-canvas)',display:'flex',fontFamily:'var(--font-body)'}}>
<div style={{width:260,borderRight:'1px solid var(--border-subtle)',padding:20,display:'flex',flexDirection:'column',gap:16}}>
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><div style={{display:'flex',alignItems:'center',gap:8}}><img src="../../assets/icon.svg" alt="" style={{width:18,height:18,filter:'drop-shadow(var(--glow-accent))'}}/><div style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:16,color:'var(--text-primary)'}}>Point & Shoot</div></div><IconButton icon={<Icon name={theme==='dark'?'sun':'moon'}/>} label="Toggle theme" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}/></div>
<div>
<div style={{fontSize:11,color:'var(--text-tertiary)',fontFamily:'var(--font-mono)',letterSpacing:'var(--tracking-wider)',textTransform:'uppercase',marginBottom:8}}>Pages</div>
<div style={{display:'flex',flexDirection:'column',gap:4}}>
<div style={{padding:'8px 10px',background:'var(--accent-subtle)',color:'var(--accent-hover)',borderRadius:'var(--radius-sm)',fontSize:13,fontFamily:'var(--font-mono)'}}>acme.cloud/pricing</div>
<div style={{padding:'8px 10px',color:'var(--text-tertiary)',borderRadius:'var(--radius-sm)',fontSize:13,fontFamily:'var(--font-mono)'}}>acme.cloud/docs</div>
</div>
</div>
<div style={{marginTop:'auto',display:'flex',flexDirection:'column',gap:4,color:'var(--text-tertiary)',fontSize:12}}>
<div>{NOTES.length} notes total</div>
<div>{NOTES.filter(n=>n.status==='sent').length} sent · {NOTES.filter(n=>n.status==='fixed').length} fixed</div>
</div>
</div>
<div style={{flex:1,display:'flex',flexDirection:'column'}}>
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 24px',borderBottom:'1px solid var(--border-subtle)'}}>
<div>
<div style={{fontSize:18,fontFamily:'var(--font-display)',fontWeight:600,color:'var(--text-primary)'}}>Notes on this page</div>
<div style={{fontSize:12,color:'var(--text-tertiary)',fontFamily:'var(--font-mono)',marginTop:2}}>acme.cloud/pricing</div>
</div>
<Button disabled={!sel.length}>{sel.length?`Send ${sel.length} to agent`:'Send to agent'}</Button>
</div>
<div style={{flex:1,overflowY:'auto',padding:'12px 24px',display:'flex',flexDirection:'column',gap:10}}>
{NOTES.map(n=><div key={n.id} style={{display:'flex',gap:14,padding:14,background:'var(--bg-surface)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-lg)'}}>
<Checkbox checked={sel.includes(n.id)} onChange={()=>toggle(n.id)}/>
<CaptureMinimap width={72} height={54} region={n.region} label={`Captured region — ${n.el}`}/>
<div style={{flex:1,minWidth:0}}>
<div style={{display:'flex',gap:8,alignItems:'center',marginBottom:4}}>
<Tag>{n.el}</Tag>
<Badge tone={n.status==='sent'?'accent':n.status==='fixed'?'success':'neutral'}>{n.status}</Badge>
</div>
<div style={{fontSize:13,color:'var(--text-primary)'}}>{n.text}</div>
<div style={{fontSize:11,fontFamily:'var(--font-mono)',color:'var(--text-tertiary)',marginTop:4,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{n.xpath}</div>
</div>
<div style={{display:'flex',gap:4,alignSelf:'flex-start'}}>
<IconButton icon={<Icon name="pencil" size={16}/>} label="Edit"/>
<IconButton icon={<Icon name="trash-2" size={16}/>} label="Delete"/>
</div>
</div>)}
</div>
</div>
</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
